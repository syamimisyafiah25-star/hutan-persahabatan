<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hutan Persahabatan</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#c8f5d8,#d9eaff);font:17px system-ui;color:#244638;padding:20px}main{max-width:850px;margin:auto;background:#fffdf5;border:5px solid white;border-radius:26px;padding:25px;box-shadow:0 15px 35px #235b4433}h1{color:#278262}button{border:0;border-radius:14px;background:#278b68;color:white;padding:13px 18px;font:inherit;font-weight:bold;cursor:pointer;margin:5px}button.opt{display:block;text-align:left;width:100%;background:#ecf9f0;color:#234c3d;border:2px solid #addbc0}button:hover{filter:brightness(.96)}.scene{height:260px;border-radius:22px;background:linear-gradient(#98dcfa 65%,#84cb87 65%);position:relative;overflow:hidden;display:flex;align-items:end;justify-content:space-around;padding:0 20px 35px;border:4px solid white}.tree{font-size:65px}.person{font-size:70px;display:inline-block}.names{font-size:15px;text-align:center;font-weight:bold}.bubble{position:absolute;top:10px;left:18%;right:18%;text-align:center;background:white;padding:12px;border-radius:18px;border:2px solid #83bd9e;font-weight:bold}.sad .person{animation:away .8s infinite alternate}.angry .person{animation:shake .22s 5}.happy .person{animation:jump .5s 3}@keyframes away{to{transform:translateX(18px)}}@keyframes shake{to{transform:translateX(9px) rotate(7deg)}}@keyframes jump{50%{transform:translateY(-18px)}}.box{background:#e9f8e9;border-left:6px solid #4fba87;padding:16px;border-radius:14px;margin:18px 0;line-height:1.6}.warn{background:#fff0d9;border-color:#e6a24a}.pill{background:#dcf3e6;padding:8px 12px;border-radius:20px;display:inline-block}input{padding:12px;border:2px solid #a8d5bb;border-radius:12px;font:inherit;max-width:100%}.bar{height:12px;border-radius:15px;background:#e1e8df;margin:15px 0;overflow:hidden}.fill{height:100%;background:#58b990}p{line-height:1.6}
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
body{font-family:'Nunito',system-ui,sans-serif;background:radial-gradient(circle at 12% 15%,#fff4bb 0,transparent 30%),radial-gradient(circle at 88% 85%,#ffd6ee 0,transparent 38%),linear-gradient(135deg,#9ce6d4,#c9ddff 55%,#f3d7ff);background-attachment:fixed}
main{max-width:940px;border-radius:32px;background:#fffcf8;border:5px solid #fff;box-shadow:0 22px 55px #335d6a3d;padding:clamp(18px,4vw,36px)}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.15;text-shadow:0 3px #fff}
h2{font-size:clamp(1.2rem,3vw,1.6rem)}
button{transition:transform .18s,filter .18s,box-shadow .18s;box-shadow:0 5px 0 #166447;letter-spacing:.01em}
button:hover{transform:translateY(-2px);filter:brightness(1.06)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #166447}
button.opt{border:2px solid #c1e6cf;background:linear-gradient(110deg,#f8fffa,#e8f8f0);padding:17px 18px;box-shadow:0 4px 0 #d3e8d9}
button.opt:hover{border-color:#48b987;background:#e6ffef}
button:focus-visible,input:focus-visible{outline:4px solid #f9c653;outline-offset:3px}
.scene{height:clamp(270px,44vw,380px);background:linear-gradient(#88d8ff 0%,#c4f1ff 58%,#b6ed9e 59%,#78c77f 100%);border:5px solid white;box-shadow:0 12px 30px #2e7b6c32;isolation:isolate}
.scene:before{content:'☀️';position:absolute;top:15px;right:12%;font-size:48px;animation:float 4s ease-in-out infinite}
.scene:after{content:'🦋　🌸　✨　🦋';position:absolute;bottom:12px;left:14%;font-size:24px;animation:float 3s ease-in-out infinite}
.scene .tree{font-size:clamp(75px,13vw,125px);filter:drop-shadow(0 6px 2px #35794c35)}
.scene .person{font-size:clamp(68px,12vw,104px);filter:drop-shadow(0 8px 4px #355b4a3d)}
.scene .names{position:relative;z-index:2;color:#22583f;text-shadow:0 2px #fff}
.bubble{top:32px;left:25%;right:25%;font-size:clamp(.85rem,2.3vw,1.12rem);border:3px solid #78caa5;box-shadow:0 7px 0 #ffffff75;z-index:3;animation:appear .4s ease both}
.box{border-radius:20px;padding:19px 22px;box-shadow:0 4px 15px #47785c12}
.pill{background:linear-gradient(120deg,#e5f8ed,#fff4c8);border:1px solid #cce9d5;font-weight:900}
.bar{height:15px}.fill{background:linear-gradient(90deg,#54c9aa,#b9db73,#ffcf6c)}
.angry{background:linear-gradient(#a5c6ef 0%,#e7d0db 60%,#c1db9c 60%,#83b978 100%)}
.sad{background:linear-gradient(#a8c9e9 0%,#d5e7f1 60%,#b1dcb0 60%,#80bc89 100%)}
.happy{background:linear-gradient(#96ddff 0%,#f0f6bb 60%,#b4e9a1 60%,#79c980 100%)}
@keyframes float{50%{transform:translateY(-11px)}}@keyframes appear{from{opacity:0;transform:scale(.85) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes sparkle{50%{filter:brightness(1.3);transform:scale(1.08)}}
@media(max-width:550px){.bubble{left:13%;right:13%;top:38px}.scene .tree{font-size:62px}.scene .person{font-size:66px}main{padding:16px}}

/* Hutan fantasi: lapisan landskap, jalan dan bunga */
body{background:radial-gradient(ellipse at 50% -20%,#fff4bd,transparent 55%),linear-gradient(160deg,#c1e8d8 0%,#a5cfc8 48%,#c8e3bf 100%)}
main{background:linear-gradient(180deg,#fffdf5,#f3fff0);border:5px solid #fff6e1}
.scene{background:linear-gradient(180deg,#8bc9d7 0%,#c7f0d6 49%,#91d19a 50%,#57a86f 100%);height:clamp(310px,46vw,410px);position:relative}
.scene:before{content:'☀️';position:absolute;right:10%;top:8%;font-size:46px;z-index:1;filter:drop-shadow(0 0 18px #ffe4a0)}
.scene:after{content:'';position:absolute;inset:auto 0 0;height:27%;background:radial-gradient(ellipse at 50% 115%,#d9c293 0 32%,transparent 33%),linear-gradient(transparent,#40995f66);z-index:0;pointer-events:none}
.farhill{position:absolute;bottom:25%;width:75%;height:32%;border-radius:50% 50% 0 0;background:#72b784;left:-15%;opacity:.8}
.farhill.two{left:45%;bottom:23%;background:#6caf7e}
.vine{position:absolute;top:-6px;font-size:42px;opacity:.85;z-index:2;animation:sway 4s ease-in-out infinite}
.vine.v1{left:2%}.vine.v2{right:3%;animation-delay:-2s}
.flowers{position:absolute;bottom:5%;left:5%;font-size:26px;letter-spacing:12px;z-index:2;animation:float 3s infinite}
.sparkles{position:absolute;top:26%;left:12%;font-size:23px;z-index:3;animation:twinkle 2s infinite}
.scene .tree{z-index:2;align-self:flex-end;filter:drop-shadow(0 10px 5px #20553c4d)}
.scene .names{z-index:4;transition:transform .7s ease}
.scene .person{display:inline-block;transition:transform .7s ease}
.bubble{left:19%;right:19%;top:20px;z-index:6;background:#fffef2;border-color:#e0bd70;box-shadow:0 6px 0 #805a2b20}
.scene.sad .names:nth-of-type(4){transform:translateX(-18px)}
.scene.angry .person{animation:shake .3s 4}
.scene.happy .person{animation:jump .65s 3}
.scene.reconcile .names{animation:reconcile 1.5s ease-in-out}
.scene.angry{background:linear-gradient(#9aa6ba 0%,#d3bbc3 49%,#86bd8e 50%,#5a9869 100%)}
.scene.sad{background:linear-gradient(#a2c4d2 0%,#d3e4d7 49%,#93c9a0 50%,#68ab79 100%)}
.scene.happy,.scene.reconcile{background:linear-gradient(#91d8f0 0%,#f1f5b8 49%,#b2e8a3 50%,#6cc681 100%)}
.story-step{display:flex;gap:12px;align-items:flex-start;background:#fff8e9;border:2px solid #e8d9ac;border-radius:18px;padding:13px 16px;margin:13px 0;animation:slideup .45s ease both}
.story-step .num{flex-shrink:0;background:#fff0bb;border-radius:50%;height:34px;width:34px;display:grid;place-items:center;font-weight:900}
.story-step p{margin:2px 0}
.scene-label{display:inline-block;background:#fff6da;color:#785b2c;border-radius:20px;padding:7px 12px;font-weight:900;margin:10px 0}
@keyframes sway{50%{transform:rotate(8deg)}}@keyframes twinkle{50%{opacity:.35;transform:scale(1.2)}}@keyframes reconcile{50%{transform:translateY(-12px)}}@keyframes slideup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.scene .tree{font-size:53px}.scene .person{font-size:67px}.bubble{left:9%;right:9%;top:28px}.flowers{font-size:18px;letter-spacing:5px}}

/* Watak kartun SVG beranimasi dan latar berlapis */
.scene{display:flex;align-items:flex-end;justify-content:space-around;padding-bottom:34px}
.scene .names{height:190px;width:clamp(90px,17vw,145px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:5;flex-shrink:0}
.scene .kid-svg{height:clamp(130px,22vw,185px);width:100%;overflow:visible;filter:drop-shadow(0 7px 3px #24543a33)}
.nameplate{display:block;background:#fffce9;padding:2px 13px;border:2px solid #fff;border-radius:18px;box-shadow:0 3px 0 #2c795c33;font-size:14px}
.scene .tree{font-size:clamp(64px,11vw,108px);z-index:3}
.scene .character-aina .arm-right,.scene .character-amir .arm-left{transform-box:fill-box;transform-origin:top center}
.scene.reconcile .arm-right,.scene.happy .arm-right{animation:wave .6s 3 ease-in-out}
.scene.angry .arm-right{animation:point .25s 5 alternate}
.scene.sad .kid-svg{filter:grayscale(.15) drop-shadow(0 7px 3px #24543a33)}
.scene.reconcile .character-aina{animation:step-right 1.1s 1 ease-in-out}
.scene.reconcile .character-amir{animation:step-left 1.1s 1 ease-in-out}
@keyframes wave{50%{transform:rotate(-25deg)}}@keyframes point{to{transform:rotate(-24deg)}}
@keyframes step-right{50%{transform:translateX(18px) translateY(-9px)}}
@keyframes step-left{50%{transform:translateX(-18px) translateY(-9px)}}
@media(max-width:560px){.scene{padding:0 2px 27px}.scene .names{width:25%;height:145px}.scene .kid-svg{height:128px}.scene .tree{font-size:52px}.scene .bubble{top:12px;left:10%;right:10%;font-size:12px}.scene .flowers{font-size:17px}}

/* Soft 3D / clay-like character rendering */
.kid-svg{filter:drop-shadow(0 12px 5px #123d4b55) drop-shadow(0 2px 2px #fff7);transform-origin:50% 90%;animation:breathing 2.8s ease-in-out infinite}
.scene .names{perspective:600px}
.scene .nameplate{background:linear-gradient(#fffef2,#e9ffdf);box-shadow:0 5px 9px #24573d40}
.scene.reconcile .kid-svg{animation:celebrate .8s ease-in-out 2}
.scene.angry .kid-svg{animation:shake3d .3s ease-in-out 5}
.scene.sad .kid-svg{animation:sad3d 1.8s ease-in-out infinite}
.scene{box-shadow:inset 0 -25px 35px #214c2b29,0 15px 30px #244b4b2d}
.scene .farhill{box-shadow:inset 0 20px 25px #fff5}
@keyframes breathing{50%{transform:scale(1.035) translateY(-3px)}}
@keyframes celebrate{35%{transform:translateY(-15px) rotateY(13deg)}70%{transform:translateY(-5px) rotateY(-13deg)}}
@keyframes shake3d{25%{transform:rotateZ(-7deg) rotateY(-13deg)}75%{transform:rotateZ(7deg) rotateY(13deg)}}
@keyframes sad3d{50%{transform:rotateZ(-4deg) translateY(5px)}}
@media(prefers-reduced-motion:reduce){.kid-svg,.scene .names,.story-step{animation:none!important}}

.scene-prop{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);font-size:35px;z-index:4;animation:propbob 2s infinite}
@keyframes propbob{50%{transform:translate(-50%,-12px) rotate(8deg)}}
.scene.angry .character-aina{animation:stormA 1.2s ease-in-out infinite}
.scene.angry .character-amir{animation:retreat 1.4s ease-in-out infinite}
.scene.sad .character-aina{animation:sadwalk 2s ease-in-out infinite}
.scene.sad .character-amir{animation:sadwalk 2s ease-in-out infinite reverse}
.scene.reconcile .character-aina{animation:approachA 1.6s ease-in-out infinite alternate}
.scene.reconcile .character-amir{animation:approachB 1.6s ease-in-out infinite alternate}
.scene.angry .character-aina .arm-right{transform-origin:87px 115px;animation:point 0.65s infinite alternate}
.scene.reconcile .character-amir .arm-left{transform-origin:43px 115px;animation:wave 1s infinite alternate}
@keyframes stormA{50%{transform:translateX(5px) rotate(-4deg)}}@keyframes retreat{50%{transform:translateX(28px) rotate(3deg)}}@keyframes sadwalk{50%{transform:translateX(-14px) translateY(5px)}}@keyframes approachA{to{transform:translateX(30px)}}@keyframes approachB{to{transform:translateX(-30px)}}@keyframes point{to{transform:rotate(-48deg)}}@keyframes wave{to{transform:rotate(35deg)}}

let step=-1,points=0,attempt=0,choice=0,name="",sound=true,ctx,music=false,musicLoop=null,noteIndex=0;
function musicNote(){
 if(!music||!sound)return;
 try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();
 const melody=[392,440,523,659,523,440,392,330,349,392,440,523,440,392,349,330];
 let f=melody[noteIndex++%melody.length],o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
 o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.022,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.32);
 o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.34)}catch(e){}
}
function toggleMusic(){music=!music;if(music){musicNote();musicLoop=setInterval(musicNote,420)}else if(musicLoop){clearInterval(musicLoop);musicLoop=null}render()}
function beep(ok){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();(ok?[523,659,784,1046]:[280,230,190]).forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.15;o.type=ok?"sine":"triangle";o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.19);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.2)})}catch(e){}}

<ellipse cx="48" cy="116" rx="5" ry="19" fill="#fff" opacity=".16"/>

function scene(mood='',msg='🦋 Hutan Persahabatan'){
const m=mood==='happy'?'reconcile':mood;
return `<div class="scene ${m}"><div class="farhill"></div><div class="farhill two"></div><div class="vine v1">🌿🍃</div><div class="vine v2">🍃🌿</div><div class="sparkles">✨🦋</div><div class="bubble">${msg}</div>${choice>=0&&step>=0&&step<5?sceneDialogue(step,choice):""}<span class="tree">🌳</span><div class="names character-aina">${avatar('aina',mood)}<span class="nameplate">Aina</span></div><div class="names character-amir">${avatar('amir',mood)}<span class="nameplate">Amir</span></div><span class="tree">🌲</span><div class="scene-prop">${step===0?"🖍️📒":step===1?"✈️":step===2?"⚽🎲":step===3?"💬":step===4?"🎨🖌️":"✨"}</div><div class="flowers">🌼🌸🍄🌷🌼</div></div>`}
const dialogues=[[["Aina: Amir! Kenapa kamu ambil pensel warna saya tanpa izin?", "Amir: Saya cuma mahu pinjam! Tak perlulah jerit kepada saya!"], ["Aina: Amir, boleh pulangkan pensel warna saya? Lain kali, minta izin dahulu ya.", "Amir: Maaf, Aina. Saya terlupa meminta izin. Ini pensel kamu."], ["Aina: Saya tak mahu bercakap dengan Amir.", "Amir: Kenapa Aina diam? Adakah saya telah buat salah?"]], [["Aina: Amir, kamu sudah rosakkan kapal terbang saya! Semua orang, tengoklah!", "Amir: Saya tak sengaja, Aina. Saya malu apabila kamu memarahi saya di depan kawan-kawan."], ["Aina: Saya sedih kapal terbang saya rosak. Boleh kita baiki bersama?", "Amir: Boleh, Aina! Maafkan saya. Mari kita cuba lipat semula."], ["Aina: Kalau kapal terbang saya rosak, saya rosakkan kapal terbang kamu juga!", "Amir: Saya kecewa, Aina. Sekarang kita berdua kehilangan hasil kerja."]], [["Amir: Kita mesti main bola. Ikut sahaja pilihan saya!", "Aina: Tapi saya juga mahu bermain permainan papan. Pendapat saya pun penting."], ["Aina: Apa kata kita main permainan papan dahulu, kemudian bermain bola?", "Amir: Idea yang bagus! Kita berdua dapat bermain permainan kegemaran."], ["Amir: Permainan papan kamu membosankan!", "Aina: Saya sedih apabila pilihan saya diejek. Saya tidak mahu bergaduh."]], [["Amir: Saya dengar Aina tak mahu berkawan dengan saya. Saya akan beritahu semua orang!", "Aina: Amir, itu tidak benar. Mengapa kamu sebarkan cerita tanpa bertanya kepada saya?"], ["Amir: Aina, saya terdengar cerita yang membuat saya sedih. Betulkah kamu tidak mahu berkawan dengan saya?", "Aina: Tidak, Amir! Kita masih berkawan. Terima kasih kerana bertanya dahulu."], ["Amir: Aina, kamu memang tak mahu berkawan dengan saya, kan?!", "Aina: Tunggu, Amir. Tolong dengar penjelasan saya dahulu."]], [["Aina: Saya boleh melukis tajuk. Amir, kamu mahu lukis gambar atau mewarna?", "Amir: Saya mahu melukis gambar! Terima kasih kerana membahagikan tugas."], ["Aina: Semua alat melukis ini saya mahu guna sendiri!", "Amir: Saya juga ahli kumpulan, Aina. Saya berasa tersisih apabila tidak dibenarkan membantu."], ["Aina: Saya tak mahu buat poster ini lagi!", "Amir: Kalau kita berhenti tanpa berbincang, poster kita tidak akan siap."]]];
function sceneDialogue(qi,ci){
 const pair=dialogues[qi][ci];
 return pair.map((line,i)=>{
   const split=line.indexOf(':');
   const who=line.slice(0,split);
   const said=line.slice(split+1).trim();
   return `<div class="speech-bubble ${who==='Aina'?'talk-aina':'talk-amir'}" style="animation-delay:${i*2.6}s">${said}</div>`;
 }).join('');
}
function dialogueScene(qIndex,choiceIndex){
 const pair=dialogues[qIndex][choiceIndex];
 return `<div class="dialogue-panel"><div class="dialogue-heading">🎭 Dialog Aina dan Amir</div>`+
 pair.map((line,i)=>{let k=line.indexOf(':');let speaker=line.slice(0,k);let words=line.slice(k+1).trim();return `<div class="speech ${speaker==='Amir'?'amir':'aina'}" style="animation-delay:${i*.65}s"><span class="speaker">${speaker}</span><p>${words}</p></div>`}).join('')+`</div>`;
}
function stages(c){
 const good=!!c[2];
 const steps=good?[
 ["🎬","Aina dan Amir berhenti seketika untuk mendengar satu sama lain."],
 ["💬",c[4]],
 ["🌈",c[1]]
 ]:[
 ["🎬","Pilihan itu menyebabkan suasana persahabatan menjadi tegang."],
 ["💬",c[4]],
 ["🌧️",c[1]]
 ];
 return `<span class="scene-label">🎞️ Animasi Cerita: ${good?"Penyelesaian":"Akibat Tindakan"}</span>`+
 steps.map((x,i)=>`<div class="story-step" style="animation-delay:${i*.2}s"><span class="num">${x[0]}</span><p>${x[1]}</p></div>`).join("")
}
let remaining=240,timerHandle=null,startedAt=0,deadline=0;
function stopClock(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function updateClock(){
 if(step<0||step>=5||step===-2)return;
 remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));
 const el=document.getElementById('clock');
 if(el){el.textContent=clockText();el.parentElement.classList.toggle('urgent',remaining<=30)}
 if(remaining===0){stopClock();step=-2;points=0;attempt=0;choice=-1;beep(false);render()}
}
function clockText(){return `${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}
function beginClock(){stopClock();remaining=240;deadline=Date.now()+240000;timerHandle=setInterval(updateClock,250)}
function render(){let s=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b>🌿✨ MISI 1 · HUTAN PERSAHABATAN</b><button onclick="sound=!sound;render()" style="background:#e3f2e8;color:#285b47">${sound?"🔊 Kesan ON":"🔇 Kesan OFF"}</button><button onclick="toggleMusic()" style="background:#e8e0ff;color:#54418a">${music?"🎵 Muzik ON":"🎶 Muzik OFF"}</button></div>`;
if(step>=0&&step<5)s+=`<div class="timer" role="timer" aria-label="Baki masa permainan">⏳ Baki masa: <span id="clock">${clockText()}</span></div>`;
if(step===-2)s+=`<div class="expired"><div class="clock">⏰</div><h1>Masa Tamat!</h1><p>Empat minit sudah berlalu. Kamu perlu memulakan semula Misi 1 dari soalan pertama.</p><p><b>Markah akan ditetapkan semula.</b></p><button onclick="restart()">🔄 Ulang Misi 1</button></div>`;
else if(step===-1)s+=`<div style="text-align:center"><span class="pill">🌈 DUNIA EMOSI AJAIB</span><h1>🌳 Misi Kedamaian</h1><p style="color:#628574;font-weight:800">Pengembaraan Kartun 3D di Hutan Persahabatan</p></div>${scene()}<p>Bantu Aina dan Amir menyelesaikan <b>5 cabaran konflik dalam masa 4 minit</b>. Jika masa tamat, kamu perlu mengulang misi dari awal. Watak kartun bergaya 3D akan menunjukkan perasaan mereka. Setiap pilihan mengubah suasana cerita! Lihat reaksi watak, baca kesannya dan dengar bunyi pilihan kamu.</p><p>Nama pemain: <input id="name" placeholder="Nama kamu"></p><button onclick="start()">✨ Mula Bermain</button>`;
else if(step>=5)s+=`<div style="text-align:center;font-size:52px;animation:sparkle 1.5s infinite">💎✨🏆✨💎</div><h1>🏆 Tahniah, ${name}!</h1>${scene("happy","Kita berjaya menjaga persahabatan! 💚")}<div class="box"><h2>💎 Kristal Persahabatan Diperoleh!</h2><p>Markah kamu: <b>${points}/50</b></p><p>Ingat: bertenang, dengar pendapat rakan dan berbincang dengan sopan.</p></div><button onclick="step=-1;points=0;render()">🔄 Main Semula</button>`;
else{let q=qs[step];s+=`<p class="pill">Soalan ${step+1}/5 · ⭐ ${points}/50 markah</p><div class="bar"><div class="fill" style="width:${step*20}%"></div></div>`;if(choice===-1)s+=`${scene()}<div class="box"><b>📖 Situasi:</b><p>${q[0]}</p></div><h2>${q[1]}</h2>${q[2].map((c,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${c[0]}</button>`).join("")}`;
else{let c=q[2][choice];s+=`<h1>${c[2]?"🌟 Tindakan Bijak!":"⚠️ Akibat Pilihan Kamu"}</h1>${scene(c[3],c[4])}<div class="box ${c[2]?"":"warn"}"><b>${c[2]?"Kesan positif:":"Kesan yang berlaku:"}</b><p>${c[1]}</p></div><p>${c[2]?"Berbincang dengan sopan membantu menyelesaikan konflik.":"Marah dan sedih ialah perasaan biasa, tetapi tindakan kita perlu menjaga perasaan orang lain. Cuba lagi."}</p><button onclick="${c[2]?"next()":"retry()"}">${c[2]?"Teruskan ➜":"🔄 Cuba Pilihan Lain"}</button>`}}
document.getElementById("app").innerHTML=s}
function start(){beginClock();if(music&&!musicLoop)musicLoop=setInterval(musicNote,420);name=document.getElementById("name").value.trim().replace(/[<>&"]/g,"")||"Pengembara Cilik";step=0;choice=-1;render()}
function answer(i){updateClock();if(step<0)return;choice=i;let good=qs[step][2][i][2];if(good)points+=attempt?5:10;beep(good);render()}
function retry(){updateClock();if(step<0)return;attempt++;choice=-1;render()}function next(){updateClock();if(step<0)return;step++;if(step>=5)stopClock();attempt=0;choice=-1;render()}function restart(){stopClock();points=0;attempt=0;choice=-1;step=0;beginClock();render()}
render();
</script></html>
